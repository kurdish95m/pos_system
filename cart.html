<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	    <meta name="google" content="notranslate">
    <title>سلة المشتريات - Mobile POS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Chart.js (not used directly but kept as requested) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: #f0f2f5;
            font-family: 'Tajawal', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        .cart-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .cart-scroll::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .cart-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 0.6;
        }
        .transition-smooth {
            transition: all 0.2s ease;
        }
        
        /* Toast Animation */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        .toast-slide-in {
            animation: slideInRight 0.3s ease forwards;
        }
        .toast-slide-out {
            animation: slideOutRight 0.3s ease forwards;
        }
    </style>
</head>
<body class="bg-gray-100 pb-24 font-sans">

    <!-- Toast Container - Modern styled notifications -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-3 pointer-events-none" style="direction: ltr;"></div>

    <header class="sticky top-0 z-20 bg-gradient-to-l from-slate-800 to-slate-900 text-white shadow-lg">
        <div class="flex justify-between items-center px-5 py-3">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='pos.html'" class="text-2xl hover:bg-white/20 p-1 rounded-full transition-smooth">
                    <i class="fas fa-arrow-right"></i>
                </button>
                <div class="flex items-center gap-2">
                    <i class="fas fa-shopping-cart text-emerald-400 text-xl"></i>
                    <h2 class="text-lg font-bold tracking-wide">سلة المشتريات</h2>
                </div>
            </div>
        </div>
    </header>

    <main class="container max-w-2xl mx-auto px-4 pt-5 pb-6">
        <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl border border-gray-100 overflow-hidden" data-aos="fade-up" data-aos-duration="400">
            <div class="flex justify-between items-center p-5 border-b border-gray-100 bg-gray-50/50">
                <div class="flex items-center gap-2 text-slate-700">
                    <i class="fas fa-boxes text-emerald-600 text-xl"></i>
                    <h3 class="font-bold text-lg">المنتجات المضافة</h3>
                    <span id="cart-badge" class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </div>
                <button onclick="window.location.href='pos.html'" class="text-gray-400 hover:text-red-500 transition-smooth text-xl">
                    <i class="fas fa-times-circle"></i>
                </button>
            </div>

            <div id="cart-items-list" class="cart-scroll max-h-[55vh] overflow-y-auto divide-y divide-gray-100 bg-white">

                    <p class="text-sm">السلة فارغة، أضف منتجات من نقطة البيع</p>

            <div class="p-5 bg-gray-50/80 border-t border-gray-200">
                <div class="flex justify-between items-center mb-6 text-lg font-bold">

                    <span class="text-2xl font-extrabold text-emerald-700" id="total-price">0.00 <span class="text-sm font-normal">د.ك</span></span>
                </div>

                <div class="space-y-3">
                    <button id="checkout-btn" onclick="checkout()" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-700 hover:to-green-700 text-white font-bold rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2 text-lg">
                        <i class="fas fa-check-circle"></i> إتمام الطلب
                    </button>
                    <button onclick="window.location.href='pos.html'" class="w-full py-3 bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold rounded-xl transition-all flex items-center justify-center gap-2 border border-blue-200">
                        <i class="fas fa-arrow-left"></i> متابعة التسوق

                    <button onclick="clearCart()" class="w-full py-3 bg-red-50 hover:bg-red-100 text-red-600 font-semibold rounded-xl transition-all flex items-center justify-center gap-2 border border-red-200">

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        AOS.init({ once: true, duration: 500 });
        
        // ==================== MODERN TOAST NOTIFICATION SYSTEM ====================
        let toastTimeout = null;
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            // Create toast element
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto rounded-xl shadow-2xl overflow-hidden transform transition-all duration-300 toast-slide-in`;
            
            // Color and icon based on type
            let bgColor, icon, borderColor;
            switch(type) {
                case 'success':
                    bgColor = 'bg-gradient-to-r from-emerald-500 to-green-600';
                    icon = 'fa-check-circle';
                    borderColor = 'border-emerald-300';
                    break;
                case 'error':
                    bgColor = 'bg-gradient-to-r from-red-500 to-rose-600';
                    icon = 'fa-exclamation-circle';
                    borderColor = 'border-red-300';
                    break;
                case 'warning':
                    bgColor = 'bg-gradient-to-r from-amber-500 to-orange-600';
                    icon = 'fa-triangle-exclamation';
                    borderColor = 'border-amber-300';
                    break;
                case 'info':
                default:
                    bgColor = 'bg-gradient-to-r from-blue-500 to-indigo-600';
                    icon = 'fa-info-circle';
                    borderColor = 'border-blue-300';
                    break;
            }
            toast.innerHTML = `
                <div class="${bgColor} text-white px-5 py-4 min-w-[280px] max-w-[400px] flex items-center gap-3 border-r-4 ${borderColor}">
                    <i class="fas ${icon} text-xl"></i>
                    <p class="text-sm font-medium leading-relaxed flex-1">${escapeHtml(message)}</p>
                    <button class="toast-close hover:bg-white/20 rounded-full p-1 transition-smooth">
                        <i class="fas fa-times text-sm"></i>
                    </button>
                </div>
            `;
            
            container.appendChild(toast);
            
            // Auto remove after duration
            const timeoutId = setTimeout(() => {
                removeToast(toast);
            }, duration);
            
            // Close button handler
            const closeBtn = toast.querySelector('.toast-close');
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    clearTimeout(timeoutId);
                    removeToast(toast);
                });
            }
            
            // Store timeout ID for cleanup
            toast.dataset.timeoutId = timeoutId;
            
            function removeToast(element) {
                element.classList.remove('toast-slide-in');
                element.classList.add('toast-slide-out');
                setTimeout(() => {
                    if (element && element.parentNode) {
                        element.remove();
                    }
                }, 300);
            }
        }
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Replace all native alerts with styled toasts
        window.alert = function(message) {
            showToast(message, 'info', 3500);
        };
        
        window.confirm = function(message) {
            return new Promise((resolve) => {
                // Create a custom confirm dialog with Tailwind
                const overlay = document.createElement('div');
                overlay.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4';
                overlay.style.animation = 'fadeIn 0.2s ease';
                
                const dialog = document.createElement('div');
                dialog.className = 'bg-white rounded-2xl shadow-2xl max-w-sm w-full mx-4 overflow-hidden transform transition-all';
                dialog.innerHTML = `
                    <div class="p-6">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center">
                                <i class="fas fa-question-circle text-amber-600 text-xl"></i>
                            </div>
                            <h3 class="text-lg font-bold text-gray-800">تأكيد</h3>
                        </div>
                        <p class="text-gray-600 text-sm leading-relaxed mb-6">${escapeHtml(message)}</p>
                        <div class="flex gap-3">
                            <button id="confirm-yes" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition-smooth shadow-md">
                                <i class="fas fa-check ml-1"></i> نعم
                            </button>
                            <button id="confirm-no" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2.5 rounded-xl transition-smooth">
                                <i class="fas fa-times ml-1"></i> إلغاء
                            </button>
                        </div>
                    </div>
                `;
                
                overlay.appendChild(dialog);
                document.body.appendChild(overlay);
                
                const handleYes = () => {
                    cleanup();
                    resolve(true);
                };
                
                const handleNo = () => {
                    cleanup();
                    resolve(false);
                };
                
                const cleanup = () => {
                    overlay.remove();
                    document.removeEventListener('keydown', handleKeydown);
                };
                
                const handleKeydown = (e) => {
                    if (e.key === 'Escape') {
                        handleNo();
                    } else if (e.key === 'Enter') {
                        handleYes();
                    }
                };
                
                document.addEventListener('keydown', handleKeydown);
                dialog.querySelector('#confirm-yes').addEventListener('click', handleYes);
                dialog.querySelector('#confirm-no').addEventListener('click', handleNo);
            });
        };

        // Add fadeIn animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
        `;
        document.head.appendChild(style);
		
        // ==================== CART LOGIC ====================
        let cartItems = JSON.parse(localStorage.getItem('pos_cart')) || [];
        let lastPrintedOrder = JSON.parse(localStorage.getItem('last_printed_order')) || null;

        function formatCurrency(value) {
            return parseFloat(value).toFixed(2);
        }

        function saveCartAndRender() {
            localStorage.setItem('pos_cart', JSON.stringify(cartItems));
            renderCart();
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            if (badge) {
                const itemCount = cartItems.reduce((sum, item) => sum + item.quantity, 0);
                badge.innerText = itemCount;
                if (itemCount === 0) badge.classList.add('hidden');
                else badge.classList.remove('hidden');
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-items-list');
            const totalSpan = document.getElementById('total-price');
            if (!container) return;
            
            let total = 0;
            container.innerHTML = '';

            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-gray-400" data-aos="fade-in">
                        <i class="fas fa-shopping-basket text-6xl mb-4 opacity-30"></i>
                        <p class="text-base font-medium">السلة فارغة</p>
                        <p class="text-xs mt-1">أضف منتجات من شاشة البيع</p>
                    </div>
                `;
                document.getElementById('checkout-btn').style.display = 'flex';
                const printBtn = document.getElementById('print-btn');
                if(printBtn) printBtn.style.display = lastPrintedOrder ? 'flex' : 'none';
                totalSpan.innerText = '0.00';
                updateCartBadge();
                return;
            }

            cartItems.forEach((item, idx) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex flex-wrap md:flex-nowrap items-center gap-3 p-4 hover:bg-gray-50 transition-smooth';
                itemDiv.setAttribute('data-aos', 'fade-up');
                itemDiv.setAttribute('data-aos-delay', (idx * 30));
                
                itemDiv.innerHTML = `
                    <div class="flex-1 min-w-[120px]">
                        <div class="font-bold text-gray-800 text-base flex items-center gap-1">
                            <i class="fas fa-tag text-emerald-500 text-xs"></i> ${escapeHtml(item.name)}
                        </div>
                        <div class="text-xs text-gray-400 mt-1">
                            ${item.stock ? `<i class="fas fa-boxes"></i> المخزون: ${item.stock}` : ''}
                        </div>
                    </div>
                    <div class="relative">
                   <input type="number" 
						   class="cart-item-qty-input w-24 pl-6 text-center border border-gray-200 rounded-lg py-1.5 bg-white focus:border-emerald-400 focus:ring-1 focus:ring-emerald-200 font-semibold text-green-700" 
						   value="${item.quantity}" 
						   min="0.01" 
						   step="any" 
						   data-index="${idx}" 
						   data-field="quantity" 
						   onchange="updateItem(this)">

	   </div>
                    <div class="relative">
                        <input type="number" class="cart-item-price-input w-24 pl-6 text-center border border-gray-200 rounded-lg py-1.5 bg-white focus:border-emerald-400 focus:ring-1 focus:ring-emerald-200 font-semibold text-green-700" value="${item.price}" min="0" step="1" data-index="${idx}" data-field="price" onchange="updateItem(this)">
                    </div>
                    <div class="min-w-[70px] text-left font-bold text-emerald-700">
               ${formatNumber(itemTotal)}   <span class="text-xs font-normal"></span>
                    </div>
                    <button class="delete-item text-red-400 hover:text-red-700 transition-all text-xl p-1" onclick="removeItem(${idx})" title="حذف">
                        <i class="fas fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(itemDiv);
            });
            
            totalSpan.innerText = formatNumber(total);
            document.getElementById('checkout-btn').style.display = 'flex';
            const printBtnElem = document.getElementById('print-btn');
            if(printBtnElem) printBtnElem.style.display = lastPrintedOrder ? 'flex' : 'none';
            updateCartBadge();
        }
        

window.updateItem = function(inputElement) {
    const index = inputElement.dataset.index;
    const field = inputElement.dataset.field;
    let newValue = parseFloat(inputElement.value);
    
    if (isNaN(newValue) || newValue < 0) {
        showToast('الرجاء إدخال قيمة صحيحة', 'warning');
        inputElement.value = cartItems[index][field];
        return;
    }
    
    if (field === 'price') {
        cartItems[index].price = newValue;
    } else if (field === 'quantity') {
        if (newValue <= 0) { // السماح بالكسور أكبر من صفر
            showToast('⚠️ الكمية يجب أن تكون أكبر من 0', 'warning');
            inputElement.value = cartItems[index].quantity;
            return;
        }
        if (cartItems[index].stock && newValue > cartItems[index].stock) {
            showToast(`⚠️ الكمية المطلوبة (${newValue}) تتجاوز المتوفر (${cartItems[index].stock})`, 'error');
            inputElement.value = cartItems[index].quantity;
            return;
        }
        // تم إزالة Math.floor هنا لدعم الكسور
        cartItems[index].quantity = newValue; 
    }
    saveCartAndRender();
};
        
        window.removeItem = function(index) {
            const itemName = cartItems[index]?.name || 'المنتج';
            cartItems.splice(index, 1);
            saveCartAndRender();
            showToast(`تم حذف ${itemName} من السلة`, 'info', 2000);
        };
        
        window.clearCart = async function() {
            if (cartItems.length === 0) {
                showToast('السلة فارغة بالفعل', 'info');
                return;
            }
            const confirmed = await window.confirm('⚠️ هل أنت متأكد من تفريغ السلة بالكامل؟');
            if (confirmed) {
                cartItems = [];
                localStorage.removeItem('pos_cart');
                renderCart();
                showToast('تم تفريغ السلة بنجاح', 'success');
            }
        };
        
        async function checkout() {
            if (cartItems.length === 0) {
                showToast('السلة فارغة! أضف منتجات أولاً.', 'warning');
                return;
            }
            
            const btn = document.getElementById('checkout-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
            btn.disabled = true;
            
            try {
                const total = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const customerId = localStorage.getItem('selected_customer_id') || null;
                const customerName = localStorage.getItem('selected_customer_name') || "زبون نقدي";
                const userId = localStorage.getItem("user_id");
                const username = localStorage.getItem("username") || "موظف";
                
                const orderPayload = { total_amount: total };
                if (userId) orderPayload.user_id = parseInt(userId);
                if (customerId) orderPayload.customer_id = parseInt(customerId);
                
                const { data: orderData, error: orderError } = await supabaseClient.from('orders').insert([orderPayload]).select();
                if (orderError) throw new Error(orderError.message);
                
                const orderId = orderData[0].id;
                const orderItemsData = cartItems.map(item => ({
                    order_id: orderId,
                    product_id: item.id,
                    quantity: item.quantity,
                    price_at_time: item.price
                }));
                
                const { error: itemsError } = await supabaseClient.from('order_items').insert(orderItemsData);
                if (itemsError) throw new Error(itemsError.message);
                
                lastPrintedOrder = {
                    id: orderId,
                    date: new Date().toLocaleString('ar-EG', { hour12: false }),
                    customer: customerName,
                    cashier: username,
                    total: total,
                    items: cartItems.map(i => ({ name: i.name, quantity: i.quantity, price: i.price }))
                };
                localStorage.setItem('last_printed_order', JSON.stringify(lastPrintedOrder));
                
                cartItems = [];
                localStorage.removeItem('pos_cart');
                renderCart();
                
                showToast(`✅ الفاتورة #${orderId} تم إنشاؤها بنجاح`, 'success', 4000);
                
                const printBtnElem = document.getElementById('print-btn');
                if(printBtnElem) printBtnElem.style.display = 'flex';
                
            } catch (err) {
                console.error(err);
                showToast('❌ حدث خطأ أثناء إنشاء الفاتورة: ' + (err.message || 'خطأ غير معروف'), 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
		
        
window.printLastReceipt = function() {
    if (!lastPrintedOrder) {
        showToast('لا توجد فاتورة سابقة للطباعة', 'info');
        return;
    }
    
    const order = lastPrintedOrder;
    
    // تجهيز أسطر المنتجات
    const itemsRows = order.items.map(i => `
        <tr>
            <td style="text-align:right; width:50%;">${escapeHtml(i.name)}</td>
            <td style="text-align:center; width:20%;">${i.quantity}</td>
            <td style="text-align:left; width:30%;">${(i.quantity * i.price).toFixed(2)}</td>
        </tr>
    `).join('');

    const printHtml = `
        <html>
        <head>
            <title>طباعة فاتورة #${order.id}</title>
            <style>
                @page { margin: 0; }
                body { 
                    font-family: 'Courier New', monospace; 
                    width: 72mm; 
                    margin: 0 auto; 
                    padding: 10px 5px; 
                    color: #000; 
                    font-size: 12px; 
                    direction: rtl; 
                }
                .header { text-align: center; margin-bottom: 10px; }
                .header h2 { margin: 0; font-size: 18px; }
                .header p { margin: 3px 0; font-size: 12px; }
                .divider { border-top: 1px dashed #000; margin: 8px 0; }
                table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
                th, td { padding: 4px 0; font-size: 11px; vertical-align: top; }
                th { border-bottom: 1px dashed #000; }
                .total-section { 
                    font-weight: bold; 
                    font-size: 14px; 
                    text-align: left; 
                    margin-top: 10px;
                    display: block;
                }
                .footer { text-align: center; margin-top: 15px; font-size: 11px; }
            </style>
        </head>
        <body>
            <div class="header">
                <h2>نظام نقاط البيع</h2>
                <p>فاتورة: #${order.id}</p>
                <p>العميل: ${escapeHtml(order.customer)}</p>
                <p>الكاشير: ${escapeHtml(order.cashier)}</p>
                <p>التاريخ: ${order.date}</p>
            </div>
            <div class="divider"></div>
            <table>
                <thead>
                    <tr>
                        <th style="text-align:right;">الصنف</th>
                        <th style="text-align:center;">كمية</th>
                        <th style="text-align:left;">إجمالي</th>
                    </tr>
                </thead>
                <tbody>
                    ${itemsRows}
                </tbody>
            </table>
            <div class="divider"></div>
            <div class="total-section">
                الإجمالي: ${parseFloat(order.total).toFixed(2)} د.ع
            </div>
            <div class="footer">
                <p>شكراً لزيارتكم!</p>
            </div>
        </body>
        </html>
    `;

    const printWindow = window.open('', '_blank', 'width=400,height=600');
    printWindow.document.write(printHtml);
    printWindow.document.close();
    
    // إعطاء وقت قصير لتحميل المحتوى قبل الطباعة
    setTimeout(() => {
        printWindow.focus();
        printWindow.print();
        printWindow.close();
    }, 500);
};

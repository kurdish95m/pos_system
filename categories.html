<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>إدارة الأصناف - Modern POS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; padding-bottom: 80px; }
        .category-card { transition: all 0.3s ease; }
        .category-card:hover { transform: translateY(-2px); shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>

    <div id="sidebar-placeholder"></div>
    <div id="nav-placeholder"></div>

    <main class="max-w-4xl mx-auto p-4">
        <div class="flex gap-3 mb-6 items-center bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
            <div class="relative flex-1">
                <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-category" placeholder="ابحث عن صنف..." onkeyup="handleSearch()" 
                    class="w-full pr-10 pl-4 py-2 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
            
            <button onclick="openAddModal()" 
                class="w-11 h-11 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-lg shadow-blue-200 transition-all flex items-center justify-center shrink-0">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <div id="summary-box" class="mb-6 bg-blue-50 border border-blue-100 text-blue-700 px-4 py-2 rounded-xl text-xs font-bold inline-block">
            جاري جلب البيانات...
        </div>

        <div id="loading" class="flex flex-col items-center justify-center py-20 text-gray-400">
            <div class="animate-spin text-3xl mb-4"><i class="fas fa-circle-notch"></i></div>
            <p>جاري تحميل الأصناف...</p>
        </div>

        <div id="categories-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-[1100] hidden backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
    <div id="add-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-md bg-white rounded-3xl shadow-2xl z-[1101] hidden flex flex-col overflow-hidden transform transition-all scale-95 opacity-0">
        <div class="p-6">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                <i class="fas fa-layer-group text-blue-500"></i> إضافة صنف جديد
            </h3>
            
            <input type="hidden" id="edit-cat-id">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 mr-1">اسم الصنف</label>
                    <input type="text" id="cat-name" placeholder="مثلاً: مشروبات باردة" 
                        class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 mr-1">وصف الصنف (اختياري)</label>
                    <textarea id="cat-desc" rows="3" placeholder="اكتب وصفاً مختصراً..." 
                        class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button onclick="saveCategory()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition-colors shadow-lg shadow-blue-100">
                    <i class="fas fa-save ml-1"></i> حفظ البيانات
                </button>
                <button onclick="closeModal()" class="px-6 bg-gray-100 hover:bg-gray-200 text-gray-600 py-3 rounded-xl font-bold transition-colors">
                    إلغاء
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/UserManager.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/Navigation.js"></script>

    <script>
        let allCategories = [];

        async function initPage() {
            await fetchCategories();
        }

        async function fetchCategories() {
            const { data, error } = await supabaseClient
                .from('categories')
                .select('*')
                .order('name', { ascending: true });

            const loadingDiv = document.getElementById('loading');
            if (error) {
                loadingDiv.innerHTML = `<div class="text-red-500"><i class="fas fa-exclamation-triangle"></i> خطأ في التحميل</div>`;
                return;
            }

            loadingDiv.style.display = 'none';
            allCategories = data;
            renderCategories(allCategories);
            updateSummary(allCategories.length);
        }

        function renderCategories(list) {
            const listDiv = document.getElementById('categories-list');
            listDiv.innerHTML = ''; 

            if (list.length === 0) {
                listDiv.innerHTML = `
                    <div class="col-span-full text-center py-10">
                        <i class="fas fa-folder-open text-gray-200 text-5xl mb-3"></i>
                        <p class="text-gray-400">لا توجد أصناف حالياً</p>
                    </div>`;
                return;
            }

            list.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'category-card bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex justify-between items-center';
                
                const safeName = cat.name.replace(/'/g, "\\'");
                const safeDesc = cat.description ? cat.description.replace(/'/g, "\\'") : '';

                item.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-lg shadow-inner">
                            <i class="fas fa-tag"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800">${cat.name}</h3>
                            <p class="text-xs text-gray-400 leading-tight mt-0.5">${cat.description || 'لا يوجد وصف متاح'}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openEditModal(${cat.id}, '${safeName}', '${safeDesc}')" 
                            class="w-9 h-9 flex items-center justify-center rounded-lg bg-orange-50 text-orange-500 hover:bg-orange-500 hover:text-white transition-all">
                            <i class="fas fa-edit text-sm"></i>
                        </button>
                        <button onclick="deleteCategory(${cat.id}, '${safeName}')" 
                            class="w-9 h-9 flex items-center justify-center rounded-lg bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition-all">
                            <i class="fas fa-trash-alt text-sm"></i>
                        </button>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        }

        function handleSearch() {
            const term = document.getElementById('search-category').value.trim().toLowerCase();
            const filtered = allCategories.filter(c => c.name.toLowerCase().includes(term));
            renderCategories(filtered);
            updateSummary(filtered.length, true);
        }

        function updateSummary(count, isSearch = false) {
            const box = document.getElementById('summary-box');
            box.innerHTML = isSearch ? `<i class="fas fa-search ml-1"></i> نتائج البحث: ${count}` : `<i class="fas fa-list ml-1"></i> إجمالي الأصناف: ${count}`;
        }

        // تحسين التحكم في المودال مع تأثيرات الحركة
        function toggleModal(show) {
            const modal = document.getElementById('add-modal');
            const overlay = document.getElementById('modal-overlay');
            if (show) {
                overlay.classList.remove('hidden');
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.add('scale-100', 'opacity-100');
                    modal.classList.remove('scale-95', 'opacity-0');
                }, 10);
            } else {
                modal.classList.add('scale-95', 'opacity-0');
                modal.classList.remove('scale-100', 'opacity-100');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        function openAddModal() {
            document.getElementById('modal-title').innerHTML = '<i class="fas fa-plus-circle text-blue-500"></i> إضافة صنف جديد';
            document.getElementById('edit-cat-id').value = '';
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-desc').value = '';
            toggleModal(true);
        }

        function openEditModal(id, name, desc) {
            document.getElementById('modal-title').innerHTML = '<i class="fas fa-edit text-orange-500"></i> تعديل الصنف';
            document.getElementById('edit-cat-id').value = id;
            document.getElementById('cat-name').value = name;
            document.getElementById('cat-desc').value = (desc === 'null' || desc === '') ? '' : desc;
            toggleModal(true);
        }

        function closeModal() { toggleModal(false); }

        async function saveCategory() {
            const id = document.getElementById('edit-cat-id').value;
            const name = document.getElementById('cat-name').value.trim();
            const description = document.getElementById('cat-desc').value.trim();

            if (!name) { 
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'يرجى إدخال اسم الصنف' }); 
                return; 
            }

            const catData = { name, description: description || null };
            let result;

            if (id) {
                result = await supabaseClient.from('categories').update(catData).eq('id', id);
            } else {
                result = await supabaseClient.from('categories').insert([catData]);
            }

            if (result.error) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: result.error.message });
            } else {
                closeModal();
                fetchCategories();
                Swal.fire({ icon: 'success', title: 'تم الحفظ', timer: 1500, showConfirmButton: false });
            }
        }

        async function deleteCategory(id, name) {
            const { isConfirmed } = await Swal.fire({
                title: 'هل أنت متأكد؟',
                text: `سيتم حذف صنف "${name}" نهائياً`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'نعم، احذف',
                cancelButtonText: 'إلغاء'
            });

            if (!isConfirmed) return;

            const { error } = await supabaseClient.from('categories').delete().eq('id', id);

            if (error) {
                Swal.fire({ icon: 'error', title: 'عذراً', text: 'لا يمكن حذف الصنف لارتباطه بمنتجات حالية' });
            } else {
                fetchCategories();
                Swal.fire({ icon: 'success', title: 'تم الحذف', timer: 1500, showConfirmButton: false });
            }
        }

        initPage();
    </script>
</body>
</html>

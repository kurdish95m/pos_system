<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>نقطة البيع - POS مع مسح الكاميرا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة مسح الباركود بالكاميرا -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .active-cat { background-color: #3b82f6 !important; color: white !important; transform: scale(1.05); }
        .bottom-nav-item:hover { background: #e2e8f0; }
        .bottom-nav-item.active { background: #3b82f6; color: white !important; }
        
        /* مودال المسح */
        .scan-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }
        .scan-container {
            width: 90%;
            max-width: 500px;
            background: #000;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative;
        }
        .scan-header {
            background: #1e293b;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        #reader {
            width: 100%;
            background: #000;
        }
        .close-scan {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-scan:hover {
            background: #dc2626;
        }
        .camera-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: #3b82f6;
            color: white;
            border-radius: 40px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .camera-btn:hover {
            background: #2563eb;
        }
        @media (max-width: 640px) {
            .camera-btn span { display: none; }
            .camera-btn { padding: 8px 10px; }
        }
    </style>
</head>
<body class="pb-28">

    <!-- Sidebar placeholder -->
    <div id="sidebar-placeholder"></div>
    <div id="nav-placeholder"></div>

    <!-- Header مع البحث وزر الكاميرا -->
    <div class="bg-slate-800 text-white shadow-lg sticky top-0 z-40">
        <div class="p-4 flex flex-col gap-4">
            <div class="space-y-3">
                <!-- اختيار العميل -->
                <div class="relative">
                    <i class="fas fa-user-circle absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <select id="customer-select" class="w-full bg-slate-700/50 text-white text-sm pr-10 pl-4 py-3 rounded-xl border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none">
                        <option value="">-- اختر العميل (زبون نقدي) --</option>
                    </select>
                </div>
                
                <!-- حقل البحث مع زر الكاميرا -->
                <div class="relative">
                    <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="ابحث بالاسم أو امسح الباركود..." onkeyup="handleSearch(event)" 
                        class="w-full bg-white text-slate-800 text-sm pr-10 pl-20 py-3 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-500" autofocus>
                    
                    <!-- زر فتح الكاميرا لمسح الباركود -->
                    <button id="scan-barcode-btn" class="camera-btn" onclick="openScannerModal()">
                        <i class="fas fa-camera"></i>
                        <span>مسح</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- الفئات -->
        <div id="categories-container" class="categories-scroll flex gap-2 overflow-x-auto px-4 pb-4 mt-1 scroll-smooth">
            <button class="cat-btn active-cat whitespace-nowrap px-6 py-2 rounded-full bg-slate-700 text-slate-300 text-xs font-bold transition-all shadow-sm" onclick="filterByCategory('all', this)">
                الكل
            </button>
        </div>
    </div>

    <main class="p-4">
        <div id="loading" class="flex flex-col items-center justify-center py-20 text-slate-400">
            <div class="animate-spin text-3xl mb-4 text-blue-500"><i class="fas fa-circle-notch"></i></div>
            <p class="text-sm font-medium">جاري تحميل قائمة المنتجات...</p>
        </div>

        <div id="product-grid" class="product-grid"></div>
    </main>

    <!-- مودال الكاميرا لمسح الباركود (مخفي افتراضياً) -->
    <div id="scanner-modal" style="display: none;" class="scan-modal">
        <div class="scan-container">
            <div class="scan-header">
                <h3 class="font-bold text-lg"><i class="fas fa-barcode ml-2"></i>مسح الباركود</h3>
                <button class="close-scan" onclick="closeScannerModal()"><i class="fas fa-times ml-1"></i>إغلاق</button>
            </div>
            <div id="reader" style="width:100%; min-height: 300px;"></div>
            <div class="p-3 text-center text-white bg-slate-800 text-xs">
                ضع الباركود أمام الكاميرا للمسح التلقائي
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/UserManager.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/Navigation.js"></script>

    <script>
        // ==================== المتغيرات العامة ====================
        let allProducts = [];
        let currentCategory = 'all';
        let html5QrCode = null;      // كائن المسح
        let isScanning = false;

        // ==================== تهيئة الصفحة ====================
        async function initPOS() {
            try {
                await fetchCustomers();
                await fetchCategories();
                await fetchProducts();
                document.getElementById('loading').style.display = 'none';
                updateCartCount();
            } catch (err) {
                console.error("Init Error:", err);
                document.getElementById('loading').innerHTML = '<p class="text-red-500">فشل تحميل البيانات. تأكد من الاتصال بالإنترنت.</p>';
            }
        }

        // جلب العملاء
        async function fetchCustomers() {
            const { data: customers } = await supabaseClient.from('customers').select('*');
            const select = document.getElementById('customer-select');
            if (customers) {
                customers.forEach(cust => {
                    const opt = document.createElement('option');
                    opt.value = cust.id;
                    opt.textContent = `${cust.name} (${cust.phone || 'بدون رقم'})`;
                    select.appendChild(opt);
                });
                const savedId = localStorage.getItem('selected_customer_id');
                if (savedId) select.value = savedId;

                select.addEventListener('change', (e) => {
                    const selected = e.target.options[e.target.selectedIndex];
                    localStorage.setItem('selected_customer_id', selected.value);
                    localStorage.setItem('selected_customer_name', selected.value ? selected.text.split('(')[0].trim() : '');
                });
            }
        }

        // جلب الفئات
        async function fetchCategories() {
            const { data: categories } = await supabaseClient.from('categories').select('*');
            if (categories) {
                const container = document.getElementById('categories-container');
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'cat-btn whitespace-nowrap px-6 py-2 rounded-full bg-slate-700 text-slate-300 text-xs font-bold transition-all shadow-sm';
                    btn.textContent = cat.name;
                    btn.onclick = () => filterByCategory(cat.id, btn);
                    container.appendChild(btn);
                });
            }
        }

        // جلب المنتجات
        async function fetchProducts() {
            const { data: products, error } = await supabaseClient.from('products').select('*');
            if (error) throw error;
            allProducts = products;
            renderProducts(allProducts);
        }

// عرض المنتجات في الشبكة مع إظهار الكمية في السلة
function renderProducts(productsToRender) {
    const gridDiv = document.getElementById('product-grid');
    gridDiv.innerHTML = '';

    if (productsToRender.length === 0) {
        gridDiv.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400 italic">لا توجد منتجات مطابقة للبحث</div>';
        return;
    }

    // قراءة السلة من localStorage
    const cart = JSON.parse(localStorage.getItem('pos_cart')) || [];

    productsToRender.forEach(product => {
        const isOutOfStock = product.stock_quantity <= 0;
        
        // جلب الكمية الموجودة في السلة لهذا المنتج
        const cartItem = cart.find(item => item.id === product.id);
        const cartQuantity = cartItem ? cartItem.quantity : 0;
        
        const card = document.createElement('div');
        card.className = `bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center transition active:scale-95 ${isOutOfStock ? 'opacity-60 grayscale' : 'cursor-pointer hover:shadow-md'}`;

        card.onclick = () => {
            if (!isOutOfStock) addToCart(product.id, product.name, product.price, product.stock_quantity);
        };

card.innerHTML = `
    <div class="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center mb-3 text-blue-500 text-xl font-black">
        ${product.name.charAt(0)}
    </div>
    <h3 class="text-xs font-bold text-slate-800 mb-1 line-clamp-2 min-h-[32px]">${product.name}</h3>
    <h2 class="text-emerald-600 font-black text-sm mb-1">${formatCurrency(product.price)}</h2>
    <div class="flex items-center gap-2 mt-1">
        <span class="text-[9px] px-2 py-1 rounded-full ${isOutOfStock ? 'bg-red-50 text-red-500' : 'bg-blue-50 text-blue-500'} font-bold">
            ${isOutOfStock ? 'نفذت الكمية' : 'المخزن: ' + product.stock_quantity}
        </span>
        ${cartQuantity > 0 ? `
            <span class="text-xs px-2 py-1 rounded-full bg-red-50 text-red-600 font-bold shadow-sm">
                🛒 ${cartQuantity}
            </span>
        ` : ''}
    </div>
`;
        gridDiv.appendChild(card);
    });
}

// إضافة منتج للسلة مع تحديث الواجهة
function addToCart(id, name, price, stock) {
    let cart = JSON.parse(localStorage.getItem('pos_cart')) || [];
    const existingItem = cart.find(item => item.id === id);

    if (existingItem) {
        if (existingItem.quantity >= stock) {
            Swal.fire({
                icon: 'warning',
                title: '⚠️ الكمية غير متوفرة',
                text: `الكمية المطلوبة (${existingItem.quantity + 1}) أكبر من المتاح (${stock})`,
                confirmButtonText: 'حسنًا',
                confirmButtonColor: '#f59e0b'
            });
            return;
        }
        existingItem.quantity += 1;
    } else {
        cart.push({ id, name, price, quantity: 1, stock: stock });
    }

    localStorage.setItem('pos_cart', JSON.stringify(cart));
    updateCartCount();
    
    // تحديث عرض المنتجات لتعكس العدد الجديد في السلة
    applyFilters();
    
    // تأثير حركي
    const cartBtn = document.querySelector('.fa-shopping-basket');
    if (cartBtn) {
        cartBtn.classList.add('animate-bounce');
        setTimeout(() => cartBtn.classList.remove('animate-bounce'), 500);
    }
    
}

// تحديث عداد السلة (في القائمة السفلية)
function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('pos_cart')) || [];
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    const cartCountSpan = document.getElementById('cart-count');
    if (cartCountSpan) cartCountSpan.innerText = totalItems;
}




        // تصفية حسب الفئة
        function filterByCategory(catId, btnElement) {
            currentCategory = catId;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active-cat'));
            btnElement.classList.add('active-cat');
            applyFilters();
        }

        // البحث اليدوي والباركود عبر الإدخال
        function handleSearch(event) {
            const rawSearchTerm = event.target.value.trim();
            if (event.key === 'Enter' && rawSearchTerm !== '') {
                const matched = allProducts.find(p => p.barcode === rawSearchTerm);
                if (matched) {
                    addToCart(matched.id, matched.name, matched.price, matched.stock_quantity);
                    event.target.value = '';
                    applyFilters();
                } else {
                    // إذا لم يوجد باركود، نطبق الفلترة فقط
                    applyFilters();
                }
            } else {
                applyFilters();
            }
        }

        function normalizeArabic(text) {
            if (!text) return '';
            return String(text).replace(/[أإآا]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
        }

        function applyFilters() {
            const rawTerm = document.getElementById('search-input').value.trim();
            const searchTerm = normalizeArabic(rawTerm);
            let filtered = allProducts;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.category_id == currentCategory);
            }

            if (searchTerm !== '') {
                filtered = filtered.filter(p => 
                    normalizeArabic(p.name).includes(searchTerm) || 
                    (p.barcode && p.barcode.includes(rawTerm))
                );
            }
            renderProducts(filtered);
        }

        // ==================== مسح الباركود بالكاميرا ====================
        async function openScannerModal() {
            const modal = document.getElementById('scanner-modal');
            modal.style.display = 'flex';
            
            // بدء المسح
            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }
                
                // طلب صلاحية الكاميرا وبدء المسح
                const config = { fps: 10, qrbox: { width: 250, height: 200 } };
                await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure);
                isScanning = true;
            } catch (err) {
                console.error("خطأ في بدء الكاميرا:", err);
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ في الكاميرا',
                    text: 'تأكد من منح صلاحية الكاميرا أو أن الكاميرا غير مستخدمة',
                    confirmButtonText: 'حسنًا'
                });
                closeScannerModal();
            }
        }

        // عند نجاح المسح
        function onScanSuccess(decodedText, decodedResult) {
            console.log("تم مسح الباركود:", decodedText);
            // البحث عن المنتج بالباركود
            const product = allProducts.find(p => p.barcode === decodedText);
            if (product) {
                // إضافة المنتج للسلة
                if (product.stock_quantity > 0) {
                    addToCart(product.id, product.name, product.price, product.stock_quantity);
                    Swal.fire({
                        icon: 'success',
                        title: 'تم إضافة المنتج',
                        text: `${product.name} أضيف إلى السلة`,
                        toast: true,
                        timer: 1500,
                        showConfirmButton: false
                    });
                    // إغلاق المودال بعد الإضافة مباشرة
                    closeScannerModal();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'المنتج نفد',
                        text: `${product.name} غير متوفر بالمخزون`,
                        confirmButtonText: 'حسنًا'
                    });
                    // لا نغلق المودال، نستمر بالمسح
                }
            } else {
                Swal.fire({
                    icon: 'warning',
                    title: 'منتج غير موجود',
                    text: `الباركود "${decodedText}" غير مسجل في قاعدة البيانات`,
                    confirmButtonText: 'حاول مجددًا'
                });
                // لا نغلق المودال لمواصلة المسح
            }
        }

        function onScanFailure(error) {
            // أخطاء المسح العادية (مثل عدم العثور على باركود) نتجاهلها
            // فقط نطبع في الكونسول للتطوير
            // console.warn("Scan error:", error);
        }

        // إغلاق المودال وإيقاف الكاميرا
        async function closeScannerModal() {
            const modal = document.getElementById('scanner-modal');
            if (modal) modal.style.display = 'none';
            
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                    isScanning = false;
                } catch (err) {
                    console.warn("خطأ في إيقاف الكاميرا", err);
                }
            }
        }

        // ==================== دعم التنسيق المالي ====================
        function formatCurrency(amount) {
            if (amount === undefined || amount === null) return '0.00 د.ل';
            return parseFloat(amount).toLocaleString('ar-LY', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' د.ل';
        }

        // استماع لأحداث الإغلاق عند الضغط خارج المودال (اختياري)
        window.onclick = function(event) {
            const modal = document.getElementById('scanner-modal');
            if (event.target === modal) {
                closeScannerModal();
            }
        };

        // ==================== بدء التشغيل ====================
        (function() {
            const sidebarUsername = document.getElementById('sidebar-username');
            if (sidebarUsername) sidebarUsername.innerText = localStorage.getItem('username') || 'إسماعيل';
            initPOS();
        })();
        
        // تحديث عداد السلة عند أي تغيير (لضمان التوافق مع السلة من صفحات أخرى)
        window.addEventListener('storage', function(e) {
            if (e.key === 'pos_cart') {
                updateCartCount();
            }
        });
        
        // عند العودة للصفحة، تحديث العداد
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) updateCartCount();
        });
        
        // منع إغلاق المودال بطريق الخطأ عند النقر داخله
        document.getElementById('scanner-modal')?.addEventListener('click', function(e) {
            if (e.target === this) closeScannerModal();
        });
        
        // إضافة وظيفة مساعدة للمطورين: إمكانية إضافة منتج عبر الباركود من أي مكان
        window.findAndAddByBarcode = async function(barcode) {
            const product = allProducts.find(p => p.barcode === barcode);
            if (product) {
                addToCart(product.id, product.name, product.price, product.stock_quantity);
                return true;
            }
            return false;
        };
    </script>
</body>
</html>

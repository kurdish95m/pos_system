<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>إدارة المنتجات - Modern POS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; padding-bottom: 90px; }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-3px); shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>

    <div id="sidebar-placeholder"></div>
    <div id="nav-placeholder"></div>

    <main class="max-w-5xl mx-auto p-4">
        <div class="flex gap-3 mb-6 items-center bg-white p-3 rounded-2xl shadow-sm border border-gray-100 sticky top-20 z-40">
            <div class="relative flex-1">
                <i class="fas fa-barcode absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-product" placeholder="ابحث بالاسم أو امسح الباركود..." onkeyup="handleSearch()" 
                    class="w-full pr-10 pl-4 py-2 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
            
            <button onclick="openAddModal()" 
                class="w-11 h-11 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-lg shadow-blue-100 transition-all flex items-center justify-center shrink-0">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <div id="summary-box" class="mb-6 flex flex-wrap gap-2">
            </div>

        <div id="loading" class="flex flex-col items-center justify-center py-20 text-gray-400">
            <div class="animate-spin text-3xl mb-4 text-blue-500"><i class="fas fa-spinner"></i></div>
            <p>جاري مزامنة المنتجات...</p>
        </div>

        <div id="products-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-[1100] hidden backdrop-blur-sm transition-all" onclick="closeModal()"></div>
    <div id="add-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[95%] max-w-lg bg-white rounded-3xl shadow-2xl z-[1101] hidden flex flex-col overflow-hidden transform transition-all scale-95 opacity-0">
        <div class="p-6 border-b border-gray-50">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-box-open text-blue-500"></i> إضافة منتج جديد
            </h3>
        </div>
        
        <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
            <input type="hidden" id="edit-prod-id">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-500 mb-1 mr-1">اسم المنتج</label>
                    <input type="text" id="prod-name" placeholder="مثلاً: كوكا كولا 330 مل" 
                        class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 mr-1">التصنيف</label>
                    <select id="prod-category" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none appearance-none">
                        <option value="">-- اختر التصنيف --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 mr-1">السعر (بيع)</label>
                    <input type="number" id="prod-price" placeholder="0.00" 
                        class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 mr-1">الباركود</label>
                    <input type="text" id="prod-barcode" placeholder="امسح الباركود" 
                        class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 mr-1">الكمية المتوفرة</label>
                    <input type="number" id="prod-stock" value="0" 
                        class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-600">
                </div>
            </div>
        </div>

        <div class="p-6 bg-gray-50 flex gap-3">
            <button onclick="saveProduct()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition-all shadow-lg shadow-blue-100">
                <i class="fas fa-check-circle ml-1"></i> حفظ المنتج
            </button>
            <button onclick="closeModal()" class="px-6 bg-white border border-gray-200 text-gray-500 py-3 rounded-xl font-bold hover:bg-gray-100 transition-all">
                إلغاء
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/UserManager.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/Navigation.js"></script>
    <script>
        const userManager = new UserManager();
        let allProducts = [];
        let allCategories = [];

        async function initPage() {
            await fetchCategories();
            await fetchInventory();
        }

        async function fetchCategories() {
            const { data, error } = await supabaseClient.from('categories').select('*');
            if (error) return;
            allCategories = data;
            const select = document.getElementById('prod-category');
            data.forEach(cat => {
                select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });
        }

        async function fetchInventory() {
            const { data: products, error } = await supabaseClient
                .from('products')
                .select('*, categories(name)')
                .order('name', { ascending: true });

            if (error) { 
                document.getElementById('loading').innerHTML = '<p class="text-red-500">حدث خطأ في جلب البيانات</p>'; 
                return; 
            }

            document.getElementById('loading').style.display = 'none';
            allProducts = products;
            renderProducts(allProducts);
            updateSummary(allProducts);
        }

        function updateSummary(list) {
            const lowStockCount = list.filter(p => p.stock_quantity <= 5).length;
            document.getElementById('summary-box').innerHTML = `
                <div class="bg-blue-50 border border-blue-100 text-blue-700 px-4 py-2 rounded-xl text-xs font-bold shadow-sm">
                    📦 إجمالي المنتجات: ${list.length}
                </div>
                ${lowStockCount > 0 ? `
                <div class="bg-red-50 border border-red-100 text-red-600 px-4 py-2 rounded-xl text-xs font-bold animate-pulse shadow-sm">
                    ⚠️ نواقص المخزون: ${lowStockCount}
                </div>` : ''}
            `;
        }

        function renderProducts(list) {
            const listDiv = document.getElementById('products-list');
            listDiv.innerHTML = ''; 

            if (list.length === 0) {
                listDiv.innerHTML = '<div class="col-span-full text-center py-20 text-gray-400">لا توجد نتائج مطابقة</div>';
                return;
            }

            list.forEach(product => {
                const stockColor = product.stock_quantity <= 5 ? 'text-red-500 bg-red-50' : 'text-green-600 bg-green-50';
                const safeName = product.name.replace(/'/g, "\\'");
                const safeBarcode = product.barcode ? product.barcode.replace(/'/g, "\\'") : '';
                const safeCatId = product.category_id || '';

                const item = document.createElement('div');
                item.className = 'product-card bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex flex-col gap-3 relative overflow-hidden';
                
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1 pr-1">
                            <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold uppercase tracking-tighter">
                                ${product.categories?.name || 'غير مصنف'}
                            </span>
                            <h3 class="font-bold text-gray-800 text-sm mt-1 line-clamp-1">${product.name}</h3>
                            <p class="text-[10px] text-gray-400 font-mono mt-0.5"># ${product.barcode || 'بدون باركود'}</p>
                        </div>
                        <div class="text-left shrink-0">
                            <p class="text-lg font-black text-slate-800">${formatCurrency(product.price)}</p>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mt-auto pt-3 border-t border-gray-50">
                        <div class="px-3 py-1 rounded-lg text-[11px] font-bold ${stockColor}">
                            الكمية: ${product.stock_quantity}
                        </div>
                        <div class="flex gap-1">
                            <button onclick="openEditModal(${product.id}, '${safeName}', ${product.price}, '${safeBarcode}', ${product.stock_quantity}, '${safeCatId}')" 
                                class="w-8 h-8 rounded-lg bg-gray-50 text-orange-500 flex items-center justify-center hover:bg-orange-500 hover:text-white transition-all">
                                <i class="fas fa-edit text-xs"></i>
                            </button>
                            <button onclick="deleteProduct(${product.id}, '${safeName}')" 
                                class="w-8 h-8 rounded-lg bg-gray-50 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition-all">
                                <i class="fas fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        }

        function handleSearch() {
            const term = document.getElementById('search-product').value.toLowerCase().trim();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(term) || (p.barcode && p.barcode.includes(term)));
            renderProducts(filtered);
            updateSummary(filtered);
        }

        function toggleModal(show) {
            const modal = document.getElementById('add-modal');
            const overlay = document.getElementById('modal-overlay');
            if(show) {
                overlay.classList.remove('hidden');
                modal.classList.remove('hidden');
                setTimeout(() => { modal.classList.add('scale-100', 'opacity-100'); }, 10);
            } else {
                modal.classList.remove('scale-100', 'opacity-100');
                setTimeout(() => { overlay.classList.add('hidden'); modal.classList.add('hidden'); }, 200);
            }
        }

        function openAddModal() {
            document.getElementById('modal-title').innerHTML = '<i class="fas fa-plus-circle text-blue-500"></i> إضافة منتج جديد';
            document.getElementById('edit-prod-id').value = '';
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-category').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-barcode').value = '';
            document.getElementById('prod-stock').value = '0';
            toggleModal(true);
        }

        function openEditModal(id, name, price, barcode, stock, catId) {
            document.getElementById('modal-title').innerHTML = '<i class="fas fa-edit text-orange-500"></i> تعديل المنتج';
            document.getElementById('edit-prod-id').value = id;
            document.getElementById('prod-name').value = name;
            document.getElementById('prod-category').value = catId;
            document.getElementById('prod-price').value = price;
            document.getElementById('prod-barcode').value = barcode;
            document.getElementById('prod-stock').value = stock;
            toggleModal(true);
        }

        function closeModal() { toggleModal(false); }

        async function saveProduct() {
            const id = document.getElementById('edit-prod-id').value;
            const data = {
                name: document.getElementById('prod-name').value.trim(),
                price: parseFloat(document.getElementById('prod-price').value),
                barcode: document.getElementById('prod-barcode').value.trim() || null,
                stock_quantity: parseInt(document.getElementById('prod-stock').value),
                category_id: document.getElementById('prod-category').value ? parseInt(document.getElementById('prod-category').value) : null
            };

            if (!data.name || isNaN(data.price)) {
                Swal.fire('تنبيه', 'يرجى إكمال البيانات الأساسية (الاسم والسعر)', 'warning');
                return;
            }

            let result;
            if (id) result = await supabaseClient.from('products').update(data).eq('id', id);
            else result = await supabaseClient.from('products').insert([data]);

            if (result.error) {
                Swal.fire('خطأ', result.error.code === '23505' ? 'هذا الباركود مستخدم بالفعل' : 'حدث خطأ أثناء الحفظ', 'error');
            } else {
                closeModal();
                fetchInventory();
                Swal.fire({ icon: 'success', title: 'تم الحفظ بنجاح', showConfirmButton: false, timer: 1000 });
            }
        }

        async function deleteProduct(id, name) {
            const { isConfirmed } = await Swal.fire({
                title: 'حذف المنتج؟',
                text: `سيتم حذف "${name}" نهائياً من النظام.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'نعم، حذف'
            });

            if (isConfirmed) {
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if (error) {
                    Swal.fire('تعذر الحذف', 'المنتج مرتبط بعمليات سابقة، لا يمكن حذفه نهائياً.', 'error');
                } else {
                    fetchInventory();
                }
            }
        }

        initPage();
    </script>
</body>
</html>

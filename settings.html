<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>إعدادات المتجر - Modern POS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .settings-card { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="sidebar-placeholder"></div>
    <div id="nav-placeholder"></div>


    <main class="max-w-xl mx-auto p-4 pt-10">
        <div class="mb-8 text-center">
            <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-lg shadow-blue-200 mb-4">
                <i class="fas fa-cog"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">إعدادات النظام</h2>
            <p class="text-gray-500 text-sm">تحكم في هوية المتجر والضرائب والعملة</p>
        </div>

        <div id="loading" class="flex flex-col items-center justify-center py-10 text-gray-400">
            <div class="animate-spin text-3xl mb-4 text-blue-500"><i class="fas fa-circle-notch"></i></div>
            <p>جاري مزامنة الإعدادات...</p>
        </div>

        <div id="settings-form-container" class="settings-card bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-gray-100 overflow-hidden hidden">
            <div class="p-8 space-y-6">
                
                <div class="space-y-2">
                    <label class="flex items-center gap-2 text-sm font-bold text-gray-700 mr-1">
                        <i class="fas fa-store text-blue-500 w-5"></i> اسم المتجر
                    </label>
                    <input type="text" id="store_name" placeholder="مثلاً: سوبر ماركت الأمانة" 
                        class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all font-semibold text-gray-800">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="flex items-center gap-2 text-sm font-bold text-gray-700 mr-1">
                            <i class="fas fa-money-bill-wave text-green-500 w-5"></i> العملة
                        </label>
                        <input type="text" id="currency_symbol" placeholder="د.ع" 
                            class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-center font-bold">
                    </div>

                    <div class="space-y-2">
                        <label class="flex items-center gap-2 text-sm font-bold text-gray-700 mr-1">
                            <i class="fas fa-percentage text-orange-500 w-5"></i> الضريبة
                        </label>
                        <div class="relative">
                            <input type="number" id="tax_rate" step="0.01" min="0" 
                                class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-center font-bold">
                        </div>
                    </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-2xl flex gap-3 items-start">
                    <i class="fas fa-info-circle text-blue-500 mt-1"></i>
                    <p class="text-xs text-blue-700 leading-relaxed">
                        هذه الإعدادات تظهر في رأس الفاتورة وتؤثر على حساب الإجماليات في صفحة البيع. تأكد من دقة البيانات.
                    </p>
                </div>

                <button onclick="saveSettings()" 
                    class="w-full bg-slate-900 hover:bg-black text-white py-4 rounded-2xl font-bold transition-all shadow-xl shadow-slate-200 mt-4 flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i>
                    حفظ كافة الإعدادات
                </button>

            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/UserManager.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/Navigation.js"></script>

    <script>
        // التحقق من الصلاحيات فوراً
        if (localStorage.getItem("user_role") !== "admin") {
            window.location.href = "pos.html";
        }

        async function loadSettings() {
            const { data, error } = await supabaseClient
                .from('settings')
                .select('*')
                .maybeSingle();

            if (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = `
                    <div class="text-red-500 bg-red-50 p-4 rounded-xl flex flex-col items-center">
                        <i class="fas fa-exclamation-triangle mb-2 text-2xl"></i>
                        <p>خطأ في تحميل الإعدادات من الخادم</p>
                    </div>`;
                return;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('settings-form-container').classList.remove('hidden');

            if (data) {
                document.getElementById('store_name').value = data.store_name || '';
                document.getElementById('currency_symbol').value = data.currency_symbol || 'د.ع';
                document.getElementById('tax_rate').value = data.tax_rate || 0;
            }
        }

        async function saveSettings() {
            const store_name = document.getElementById('store_name').value.trim();
            const currency_symbol = document.getElementById('currency_symbol').value.trim();
            const tax_rate = parseFloat(document.getElementById('tax_rate').value) || 0;

            if (!store_name) {
                Swal.fire('تنبيه', 'يرجى كتابة اسم المتجر أولاً', 'warning');
                return;
            }

            // إظهار مؤشر تحميل على الزر
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> جاري الحفظ...';

            // التحقق من وجود سجل مسبق
            const { data: existing } = await supabaseClient
                .from('settings')
                .select('id')
                .maybeSingle();

            let result;
            const payload = { store_name, currency_symbol, tax_rate };

            if (existing) {
                result = await supabaseClient.from('settings').update(payload).eq('id', existing.id);
            } else {
                result = await supabaseClient.from('settings').insert([payload]);
            }

            btn.disabled = false;
            btn.innerHTML = originalText;

            if (result.error) {
                Swal.fire('خطأ', 'فشل حفظ الإعدادات: ' + result.error.message, 'error');
            } else {
                // تحديث الـ LocalStorage للاستخدام الفوري بدون تحديث الصفحة
                localStorage.setItem('store_settings', JSON.stringify(payload));
                
                Swal.fire({
                    icon: 'success',
                    title: 'تم التحديث',
                    text: 'تم حفظ إعدادات المتجر بنجاح',
                    timer: 2000,
                    showConfirmButton: false
                });
            }
        }

        // تشغيل التحميل عند فتح الصفحة
        loadSettings();
    </script>
</body>
</html>

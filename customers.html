<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>إدارة العملاء - Modern POS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; padding-bottom: 80px; }
        .customer-card { transition: all 0.3s ease; }
        .customer-card:hover { transform: translateY(-2px); }
        /* إخفاء السكرول بار لكشف الحساب */
        #statement-body::-webkit-scrollbar { width: 4px; }
        #statement-body::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
		
		

    </style>
</head>
<body>

    <div id="sidebar-placeholder"></div>
    <div id="nav-placeholder"></div>

    <main class="max-w-4xl mx-auto p-4">
        <div class="flex gap-3 mb-6 items-center bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
            <div class="relative flex-1">
                <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-customer" placeholder="ابحث باسم العميل أو رقم الهاتف..." onkeyup="handleSearch()" 
                    class="w-full pr-10 pl-4 py-2 bg-gray-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
            
            <button onclick="openModal()" 
                class="w-11 h-11 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-lg shadow-blue-200 transition-all flex items-center justify-center shrink-0">
                <i class="fas fa-user-plus"></i>
            </button>
        </div>

        <div id="summary-box" class="mb-6 flex gap-2">
            </div>

        <div id="loading" class="flex flex-col items-center justify-center py-20 text-gray-400">
            <div class="animate-spin text-3xl mb-4"><i class="fas fa-circle-notch"></i></div>
            <p>جاري تحميل بيانات العملاء...</p>
        </div>

        <div id="customers-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-[1100] hidden backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
    <div id="add-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-md bg-white rounded-3xl shadow-2xl z-[1101] hidden flex flex-col overflow-hidden transform transition-all scale-95 opacity-0">
        <div class="p-6">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                <i class="fas fa-user-circle text-blue-500"></i> إضافة عميل جديد
            </h3>
            
            <input type="hidden" id="edit-customer-id">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 mr-1">اسم العميل</label>
                    <input type="text" id="customer-name" placeholder="الاسم الكامل" 
                        class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 mr-1">رقم الهاتف</label>
                    <input type="tel" id="customer-phone" placeholder="05xxxxxxxx" 
                        class="w-full p-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-left" dir="ltr">
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button onclick="saveCustomer()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition-all shadow-lg shadow-blue-100">
                    حفظ البيانات
                </button>
                <button onclick="closeModal()" class="px-6 bg-gray-100 hover:bg-gray-200 text-gray-600 py-3 rounded-xl font-bold transition-all">
                    إلغاء
                </button>
            </div>
        </div>
    </div>

    <div id="statement-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[95%] max-w-lg bg-white rounded-3xl shadow-2xl z-[1201] hidden flex flex-col max-h-[85vh] overflow-hidden transform transition-all scale-95 opacity-0">
        <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
            <h3 class="font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-file-invoice text-blue-500"></i> كشف حساب العميل
            </h3>
            <button onclick="closeStatementModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 text-gray-400">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="statement-body" class="p-5 overflow-y-auto flex-1 bg-white">
            </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>

    <script src="js/UserManager.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/Navigation.js"></script>

    <script>
        const userManager = new UserManager();
        let allCustomers = [];

        async function fetchCustomers() {
            const { data: customers, error } = await supabaseClient
                .from('customers')
                .select('*')
                .order('created_at', { ascending: false });

            const loadingDiv = document.getElementById('loading');
            if (error) { 
                loadingDiv.innerHTML = `<p class="text-red-500">خطأ في تحميل البيانات</p>`; 
                return; 
            }
            
            loadingDiv.style.display = 'none';
            allCustomers = customers;
            updateSummary(allCustomers);
            renderCustomers(allCustomers);
        }

        function updateSummary(list) {
            const totalPoints = list.reduce((sum, c) => sum + (c.points || 0), 0);
            document.getElementById('summary-box').innerHTML = `
                <div class="bg-blue-50 border border-blue-100 text-blue-700 px-4 py-2 rounded-xl text-xs font-bold">
                    <i class="fas fa-users ml-1"></i> العملاء: ${list.length}
                </div>
                <div class="bg-amber-50 border border-amber-100 text-amber-700 px-4 py-2 rounded-xl text-xs font-bold">
                    <i class="fas fa-star ml-1"></i> إجمالي النقاط: ${totalPoints}
                </div>
            `;
        }

        function renderCustomers(list) {
            const listDiv = document.getElementById('customers-list');
            listDiv.innerHTML = ''; 

            if(list.length === 0) { 
                listDiv.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400"><i class="fas fa-search-minus text-4xl mb-2"></i><p>لا توجد نتائج</p></div>`;
                return; 
            }

            list.forEach(customer => {
                const item = document.createElement('div');
                item.className = 'customer-card bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-4';
                
                const safeName = customer.name.replace(/'/g, "\\'");
                const safePhone = customer.phone ? String(customer.phone).replace(/'/g, "\\'") : '';

                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl shadow-inner font-bold">
                                ${customer.name.charAt(0)}
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">${customer.name}</h3>
                                <p class="text-xs text-gray-400"><i class="fas fa-phone-alt text-[10px] ml-1"></i> ${customer.phone || 'بدون رقم'}</p>
                            </div>
                        </div>
                        <div class="bg-amber-100 text-amber-700 px-3 py-1 rounded-lg text-xs font-bold">
                            ⭐ ${customer.points || 0}
                        </div>
                    </div>
                    
                    <div class="flex gap-2 border-t border-gray-50 pt-3">
                        <button onclick="viewStatement(${customer.id}, '${safeName}')" 
                            class="flex-1 bg-gray-50 hover:bg-blue-50 text-gray-600 hover:text-blue-600 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2">
                            <i class="fas fa-file-alt"></i> كشف حساب
                        </button>
                        <button onclick="openEditModal(${customer.id}, '${safeName}', '${safePhone}')" 
                            class="w-10 h-10 flex items-center justify-center rounded-lg bg-orange-50 text-orange-500 hover:bg-orange-500 hover:text-white transition-all">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteCustomer(${customer.id}, '${safeName}')" 
                            class="w-10 h-10 flex items-center justify-center rounded-lg bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition-all">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        }

        // نفس الدوال السابقة مع تحسين الأنيميشن
        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            const overlay = document.getElementById('modal-overlay');
            if (show) {
                overlay.classList.remove('hidden');
                modal.classList.remove('hidden');
                setTimeout(() => { modal.classList.add('scale-100', 'opacity-100'); modal.classList.remove('scale-95', 'opacity-0'); }, 10);
            } else {
                modal.classList.add('scale-95', 'opacity-0');
                modal.classList.remove('scale-100', 'opacity-100');
                setTimeout(() => { overlay.classList.add('hidden'); modal.classList.add('hidden'); }, 300);
            }
        }

        function openModal() {
            document.getElementById('modal-title').innerHTML = '<i class="fas fa-user-plus text-blue-500"></i> إضافة عميل جديد';
            document.getElementById('edit-customer-id').value = '';
            document.getElementById('customer-name').value = ''; 
            document.getElementById('customer-phone').value = ''; 
            toggleModal('add-modal', true);
        }

        function openEditModal(id, name, phone) {
            document.getElementById('modal-title').innerHTML = '<i class="fas fa-user-edit text-orange-500"></i> تعديل بيانات العميل';
            document.getElementById('edit-customer-id').value = id;
            document.getElementById('customer-name').value = name; 
            document.getElementById('customer-phone').value = phone; 
            toggleModal('add-modal', true);
        }

        function closeModal() { toggleModal('add-modal', false); toggleModal('statement-modal', false); }

        async function saveCustomer() {
            const id = document.getElementById('edit-customer-id').value;
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();

            if (!name) { Swal.fire('خطأ', 'يرجى إدخال اسم العميل', 'error'); return; }

            const customerData = { name, phone: phone || null };
            let result;

            if (id) {
                result = await supabaseClient.from('customers').update(customerData).eq('id', id);
            } else {
                result = await supabaseClient.from('customers').insert([customerData]);
            }

            if (result.error) {
                Swal.fire('خطأ', result.error.code === '23505' ? 'رقم الهاتف مسجل مسبقاً' : 'حدث خطأ أثناء الحفظ', 'error');
            } else {
                closeModal();
                fetchCustomers();
                Swal.fire({ icon: 'success', title: 'تم الحفظ بنجاح', showConfirmButton: false, timer: 1500 });
            }
        }

        async function deleteCustomer(id, name) {
            const { isConfirmed } = await Swal.fire({
                title: 'حذف العميل؟',
                text: `سيتم حذف "${name}"، وستبقى فواتيره مسجلة كزبون نقدي.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'نعم، احذف',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#ef4444'
            });

            if (isConfirmed) {
                const { error } = await supabaseClient.from('customers').delete().eq('id', id);
                if (error) Swal.fire('خطأ', 'تعذر حذف العميل', 'error');
                else fetchCustomers();
            }
        }

        async function viewStatement(customerId, customerName) {
            toggleModal('statement-modal', true);
            const body = document.getElementById('statement-body');
            body.innerHTML = '<div class="flex justify-center py-10 animate-pulse text-gray-400">جاري جلب الفواتير...</div>';

            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('id, total_amount, created_at')
                .eq('customer_id', customerId)
                .order('created_at', { ascending: false });

            if (error || orders.length === 0) {
                body.innerHTML = `<div class="text-center py-10 text-gray-400">لا توجد فواتير مسجلة لهذا العميل</div>`;
                return;
            }

            let totalSpent = orders.reduce((s, o) => s + parseFloat(o.total_amount), 0);
            
            let html = `
                <div class="bg-slate-900 text-white p-5 rounded-2xl mb-6 shadow-lg shadow-slate-200">
                    <p class="text-slate-400 text-xs mb-1">إجمالي مشتريات العميل</p>
                    <div class="text-2xl font-bold">${formatCurrency(totalSpent.toFixed(2))}</div>
                    <div class="text-[10px] text-slate-400 mt-2 italic">عدد الفواتير: ${orders.length}</div>
                </div>
                <div class="space-y-3">
            `;

            orders.forEach(order => {
                const date = new Date(order.created_at).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
                html += `
                    <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100">
                        <div>
                            <div class="text-sm font-bold text-gray-800">فاتورة #${order.id}</div>
                            <div class="text-[10px] text-gray-400">${date}</div>
                        </div>
                        <div class="text-sm font-bold text-blue-600">${formatCurrency(order.total_amount.toFixed(2))}</div>
                    </div>
                `;
            });

            html += `</div>`;
            body.innerHTML = html;
        }

        function closeStatementModal() { toggleModal('statement-modal', false); }

        function normalizeArabic(text) {
            if (!text) return '';
            return String(text).replace(/[أإآا]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
        }

        function handleSearch() {
            const term = normalizeArabic(document.getElementById('search-customer').value.trim());
            const filtered = allCustomers.filter(c => normalizeArabic(c.name).includes(term) || (c.phone && c.phone.includes(term)));
            renderCustomers(filtered);
            updateSummary(filtered);
        }

        fetchCustomers();
    </script>
</body>
</html>

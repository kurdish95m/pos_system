<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>سجل الطلبات - Modern POS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; padding-bottom: 90px; }
        .order-card { transition: all 0.2s ease; cursor: pointer; }
        .order-card:active { transform: scale(0.98); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
		
		      .bottom-nav-item:hover {
            background: #e2e8f0;
        }

        .bottom-nav-item.active {
            background: #3b82f6;
            color: white !important;
        }
    </style>
</head>
<body>

    <div id="sidebar-placeholder"></div>
    <div id="nav-placeholder"></div>

    <main class="max-w-4xl mx-auto p-4">
        <div class="flex flex-col gap-4 mb-6">
            <h1 class="text-2xl font-black text-slate-800 flex items-center gap-2">
                <i class="fas fa-file-invoice-dollar text-blue-600"></i> سجل الفواتير
            </h1>
            
            <div class="relative">
                <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-order" placeholder="ابحث برقم الفاتورة، اسم العميل، أو الكاشير..." onkeyup="handleSearch()" 
                    class="w-full pr-12 pl-4 py-3 bg-white border border-slate-200 rounded-2xl shadow-sm focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all">
            </div>
        </div>

        <div id="summary-box" class="grid grid-cols-2 gap-3 mb-6">
            </div>

        <div id="loading" class="flex flex-col items-center justify-center py-20 text-slate-400">
            <div class="animate-spin text-3xl mb-4 text-blue-600"><i class="fas fa-circle-notch"></i></div>
            <p class="text-sm font-bold">جاري تحميل السجل...</p>
        </div>

        <div id="orders-list" class="space-y-3">
            </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[1100] hidden transition-opacity" onclick="closeInvoiceModal()"></div>
    
    <div id="invoice-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[95%] max-w-lg bg-white rounded-3xl shadow-2xl z-[1101] hidden flex flex-col max-h-[90vh] overflow-hidden transform transition-all scale-95 opacity-0">
        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
            <h3 class="font-black text-slate-800 flex items-center gap-2">
                <i class="fas fa-receipt text-blue-600"></i> تفاصيل الفاتورة
            </h3>
            <button onclick="closeInvoiceModal()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white border border-slate-200 text-slate-400 hover:text-red-500 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div id="invoice-body" class="p-5 overflow-y-auto custom-scrollbar flex-1">
            </div>

        <div class="p-4 bg-slate-50 border-t border-slate-100 flex gap-3">
            <button onclick="printReceipt()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-slate-200 transition-all active:scale-95">
                <i class="fas fa-print"></i> طباعة (80mm)
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/UserManager.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/Navigation.js"></script>

    <script>
        let allOrders = []; 
        let currentOrderForPrint = null; 
        let currentItemsForPrint = [];

        function updateSummary(ordersArray) {
            const totalOrders = ordersArray.length;
            const totalAmount = ordersArray.reduce((sum, order) => sum + parseFloat(order.total_amount), 0);
            
            document.getElementById('summary-box').innerHTML = `
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">عدد الفواتير</p>
                    <div class="text-xl font-black text-slate-800">${totalOrders} <span class="text-xs font-normal text-slate-400 mr-1">فاتورة</span></div>
                </div>
                <div class="bg-blue-600 p-4 rounded-2xl shadow-lg shadow-blue-100">
                    <p class="text-[10px] font-bold text-blue-100 uppercase tracking-wider mb-1">إجمالي المبيعات</p>
                    <div class="text-xl font-black text-white">${formatCurrencyPrice(totalAmount)}</div>
                </div>
            `;
        }

        async function fetchOrders() {
            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('id, total_amount, created_at, customers ( name ), users ( username )') 
                .order('created_at', { ascending: false });

            if (error) {
                document.getElementById('loading').innerHTML = `<p class="text-red-500 font-bold">حدث خطأ في جلب البيانات</p>`;
                return;
            }

            document.getElementById('loading').style.display = 'none';
            allOrders = orders; 
            updateSummary(allOrders); 
            renderOrders(allOrders); 
        }

        function renderOrders(ordersToRender) {
            const listDiv = document.getElementById('orders-list');
            listDiv.innerHTML = '';

            if(ordersToRender.length === 0) {
                listDiv.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-200">
                        <i class="fas fa-search text-4xl text-slate-200 mb-3"></i>
                        <p class="text-slate-400 font-medium">لا توجد فواتير مطابقة</p>
                    </div>`;
                return;
            }

            ordersToRender.forEach(order => {
                const date = new Date(order.created_at).toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });
                const customerName = order.customers ? order.customers.name : 'زبون نقدي';
                const cashierName = order.users ? order.users.username : 'غير معروف';

                const card = document.createElement('div');
                card.className = 'order-card bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center hover:border-blue-200';
                card.onclick = () => viewInvoice(order.id, order.total_amount, order.created_at, customerName, cashierName);

                card.innerHTML = `
                    <div class="flex gap-4 items-center">
                        <div class="w-12 h-12 bg-slate-50 rounded-xl flex items-center justify-center text-blue-600 text-lg">
                            <i class="fas fa-file-invoice"></i>
                        </div>
                        <div>
                            <h3 class="font-black text-slate-800 text-sm mb-1">فاتورة #${order.id}</h3>
                            <div class="flex flex-col gap-0.5">
                                <span class="text-[11px] text-slate-500"><i class="fas fa-user ml-1 text-[9px]"></i> ${customerName}</span>
                                <span class="text-[11px] text-slate-400 tracking-tighter"><i class="fas fa-clock ml-1 text-[9px]"></i> ${date}</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-left">
                        <div class="text-emerald-600 font-black text-sm">${formatCurrencyPrice(order.total_amount)}</div>
                        <div class="text-[9px] text-slate-400 bg-slate-50 px-2 py-0.5 rounded-full mt-1 inline-block">${cashierName}</div>
                    </div>
                `;
                listDiv.appendChild(card);
            });
        }

        async function viewInvoice(orderId, total, dateStr, customerName, cashierName) {
            const overlay = document.getElementById('modal-overlay');
            const modal = document.getElementById('invoice-modal');
            const body = document.getElementById('invoice-body');

            overlay.classList.remove('hidden');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.add('scale-100', 'opacity-100'); modal.classList.remove('scale-95', 'opacity-0'); }, 10);

            body.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10 animate-pulse">
                    <i class="fas fa-spinner fa-spin text-2xl text-blue-500 mb-2"></i>
                    <p class="text-xs text-slate-400">جاري تحميل الأصناف...</p>
                </div>`;

            const { data: items, error } = await supabaseClient
                .from('order_items')
                .select('quantity, price_at_time, products ( name )')
                .eq('order_id', orderId);

            if (error) return;

            currentOrderForPrint = { id: orderId, total, date: new Date(dateStr).toLocaleString('ar-EG'), customer: customerName, cashier: cashierName };
            currentItemsForPrint = items;

       let itemsHtml = items.map(i => `
    <tr class="border-b border-slate-50">
        <td class="py-3 text-xs font-bold text-slate-700">${i.products?.name || 'منتج غير معروف'}</td>
        <td class="py-3 text-center text-xs text-slate-500">${i.quantity}</td>
        <td class="py-3 text-center text-xs text-slate-600">${formatCurrency(i.price_at_time)}</td> <!-- سعر الوحدة -->
        <td class="py-3 text-left text-xs font-black text-slate-800">${formatCurrency(i.quantity * i.price_at_time)}</td>
    </tr>
`).join('');

            body.innerHTML = `
                <div class="bg-blue-50 border border-blue-100 p-4 rounded-2xl mb-6">
                    <div class="grid grid-cols-2 gap-y-2">
                        <div><p class="text-[10px] text-blue-400 font-bold uppercase">العميل</p><p class="text-xs font-bold text-blue-900">${customerName}</p></div>
                        <div class="text-left"><p class="text-[10px] text-blue-400 font-bold uppercase">الكاشير</p><p class="text-xs font-bold text-blue-900">${cashierName}</p></div>
                        <div><p class="text-[10px] text-blue-400 font-bold uppercase">التاريخ</p><p class="text-xs font-bold text-blue-900">${currentOrderForPrint.date}</p></div>
                        <div class="text-left"><p class="text-[10px] text-blue-400 font-bold uppercase">رقم الفاتورة</p><p class="text-xs font-bold text-blue-900">#${orderId}</p></div>
                    </div>
                </div>

                <table class="w-full mb-6">
               <thead>
    <tr class="text-[10px] text-slate-400 uppercase border-b border-slate-100">
        <th class="pb-2 text-right">الصنف</th>
        <th class="pb-2 text-center">الكمية</th>
        <th class="pb-2 text-center">سعر الوحدة</th>   <!-- العمود الجديد -->
        <th class="pb-2 text-left">المجموع</th>
    </tr>
</thead>
                    <tbody>${itemsHtml}</tbody>
                </table>

                <div class="bg-slate-900 p-4 rounded-2xl flex justify-between items-center shadow-xl shadow-slate-200">
                    <span class="text-slate-400 text-sm font-bold">الإجمالي النهائي</span>
                    <span class="text-white text-xl font-black">${formatCurrencyPrice(total)}</span>
                </div>
            `;
        }

        function closeInvoiceModal() {
            const modal = document.getElementById('invoice-modal');
            const overlay = document.getElementById('modal-overlay');
            modal.classList.add('scale-95', 'opacity-0');
            modal.classList.remove('scale-100', 'opacity-100');
            setTimeout(() => { overlay.classList.add('hidden'); modal.classList.add('hidden'); }, 300);
        }

        function handleSearch() {
            const term = document.getElementById('search-order').value.trim().toLowerCase();
            const filtered = allOrders.filter(o => {
                const customer = o.customers ? o.customers.name.toLowerCase() : 'زبون نقدي';
                const cashier = o.users ? o.users.username.toLowerCase() : 'غير معروف';
                return o.id.toString().includes(term) || customer.includes(term) || cashier.includes(term);
            });
            updateSummary(filtered);
            renderOrders(filtered);
        }

function printReceipt() {
    // التحقق من وجود بيانات للطباعة
    if (!currentOrderForPrint || currentItemsForPrint.length === 0) return;

    // حساب الإجمالي من العناصر للتأكد (يمكن استخدام total الموجود في الطلب)
    // لكننا سنعتمد على total الموجود في order للاتساق
    const total = currentOrderForPrint.total;

    // بناء محتوى الفاتورة
    const printContent = `
        <html>
        <head>
            <title>طباعة فاتورة #${currentOrderForPrint.id}</title>
            <style>
                @page { margin: 0; }
                body {
                    font-family: 'Courier New', monospace;
                    width: 72mm;
                    margin: 0 auto;
                    padding: 10px 0;
                    color: #000;
                    font-size: 12px;
                    direction: rtl;
                }
                .header { text-align: center; margin-bottom: 10px; }
                .header h2 { margin: 0; font-size: 18px; }
                .header p { margin: 3px 0; font-size: 12px; }
                .divider { border-top: 1px dashed #000; margin: 8px 0; }
                table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
                th, td { text-align: right; padding: 4px 0; font-size: 12px; }
                th { border-bottom: 1px dashed #000; }
                .total-section {
                    font-weight: bold;
                    font-size: 14px;
                    text-align: left;
                }
                .footer { text-align: center; margin-top: 15px; font-size: 12px; }
            </style>
        </head>
        <body>
            <div class="header">
                <h2>نظام نقاط البيع</h2>
                <p>فاتورة: #${currentOrderForPrint.id}</p>
                <p>العميل: ${currentOrderForPrint.customer}</p>
                <p>الكاشير: ${currentOrderForPrint.cashier}</p>
                <p>التاريخ: ${currentOrderForPrint.date}</p>
            </div>
            <div class="divider"></div>
            <table>
                <thead>
                <th style="width: 40%;">الصنف</th>
				<th style="width: 15%; text-align:center;">الكمية</th>
				<th style="width: 20%; text-align:center;">سعر الوحدة</th>
				<th style="width: 25%;">الإجمالي</th>
                </thead>
                <tbody>
                   ${currentItemsForPrint.map(item => `
    <tr>
        <td>${item.products?.name || 'محذوف'}</td>
        <td style="text-align:center;">${item.quantity}</td>
        <td style="text-align:center;">${formatCurrency(item.price_at_time)}</td>
        <td>${formatCurrency(item.quantity * item.price_at_time)}</td>
    </tr>
`).join('')}
                </tbody>
            </table>
            <div class="divider"></div>
            <div class="total-section">
                الإجمالي: ${formatCurrency(total)}
            </div>
            <div class="divider"></div>
            <div class="footer">
                <p>شكراً لزيارتكم!</p>
            </div>
        </body>
        </html>
    `;

    // فتح نافذة الطباعة
    const printWindow = window.open('', '_blank', 'width=400,height=600');
    if (!printWindow) {
        alert('يرجى السماح للنوافذ المنبثقة لطباعة الفاتورة');
        return;
    }

    printWindow.document.write(printContent);
    printWindow.document.close();
    printWindow.focus();

    // طباعة وإغلاق النافذة بعد اكتمال الطباعة
    setTimeout(() => {
        printWindow.print();
        printWindow.close();
    }, 500);
}

        fetchOrders();
    </script>
</body>
</html>
